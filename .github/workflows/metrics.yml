# GitHub profile metrics, generated by lowlighter/metrics
# https://github.com/lowlighter/metrics
name: Metrics

on:
  # Daily refresh
  schedule:
    - cron: "0 0 * * *"
  # Manual trigger from the Actions tab
  workflow_dispatch:
  # Regenerate when this workflow itself changes
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Base: header, activity, community, repositories, metadata
          base: header, activity, community, repositories, metadata
          base_indepth: yes

          # Display
          config_timezone: Asia/Shanghai
          config_display: large
          config_order: base.header, languages, calendar, achievements, repositories, base.activity, base.community

          # Commit the generated image back to this repository
          output_action: commit

          # Most used languages
          plugins_languages: yes
          plugins_languages_analysis_timeout: 15
          plugins_languages_categories: programming
          plugins_languages_sections: most-used
          plugins_languages_details: bytes-size, percentage, lines
          plugins_languages_limit: 8

          # Contribution calendar
          plugins_calendar: yes
          plugins_calendar_limit: 2

          # Achievement trophies
          plugins_achievements: yes
          plugins_achievements_threshold: C
          plugins_achievements_display: detailed
          plugins_achievements_limit: 6
